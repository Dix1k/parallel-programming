<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Философы</title>
<style>
  canvas { border:1px solid black; }
</style>
</head>
<body>

<h2>Обедающие философы</h2>
<p id="status"></p>
<canvas id="canvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const N = 5;

let philosophers = new Array(N).fill("thinking");
let forks = new Array(N).fill(true);

let interval;
let current = 0;

function tryEat(i) {
  if (philosophers[i] !== "thinking") return;

  let left = i;
  let right = (i + 1) % N;

  if (forks[left] && forks[right]) {
    forks[left] = false;
    forks[right] = false;

    philosophers[i] = "eating";

    setTimeout(() => {
      forks[left] = true;
      forks[right] = true;

      philosophers[i] = "done";

      draw(); // 🔥 обновляем сразу

      checkFinish();
    }, 1500);
  }
}

function checkFinish() {
  if (philosophers.every(p => p === "done")) {
    clearInterval(interval);
    status.innerText = "Все философы наелись!";
    draw(); // 🔥 финальная отрисовка
  }
}

function loop() {
  tryEat(current);
  current = (current + 1) % N;
}

function draw() {
  ctx.clearRect(0,0,400,400);

  for (let i = 0; i < N; i++) {
    let angle = (i / N) * 2 * Math.PI;

    let x = 200 + Math.cos(angle) * 120;
    let y = 200 + Math.sin(angle) * 120;

    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI*2);

    if (philosophers[i] === "thinking") ctx.fillStyle = "gray";
    if (philosophers[i] === "eating") ctx.fillStyle = "orange";
    if (philosophers[i] === "done") ctx.fillStyle = "green";

    ctx.fill();

    ctx.fillStyle = "black";
    ctx.fillText(i, x-5, y+5);
  }
}

interval = setInterval(() => {
  loop();
  draw();
}, 400);

</script>

</body>
</html>
