<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Фибоначчи</title>
</head>
<body>

<h2>Числа Фибоначчи</h2>
<input type="number" id="n" value="10">
<button onclick="calc()">Рассчитать</button>
<p id="out"></p>

<script>
function fibActor(n, callback) {
  if (n <= 1) return callback(n);

  fibActor(n - 1, (a) => {
    fibActor(n - 2, (b) => {
      callback(a + b);
    });
  });
}

function calc() {
  let n = parseInt(nInput.value);
  fibActor(n, (res) => {
    out.innerText = "F(" + n + ") = " + res;
  });
}

const nInput = document.getElementById('n');
</script>

</body>
</html>
